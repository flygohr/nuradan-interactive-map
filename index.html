<!DOCTYPE html>
<html style="height: 100%;">

<head>
    <title>Nuradan World Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>
    <script src="papaparse/papaparse.js"></script>
</head>

<body style="height: 100%; margin: 0;">
    <div id="map" style="width: 100%; height: 100%; background: #000000;"></div>
    <script type="text/javascript">
        //Creating the Map
        var map = L.map('map', {
            crs: L.CRS.Simple,
            center: [-15.856962, 47.862135],
            zoom: 7,
        });

        var tilesH = 44;
        var tilesW = 78;
        var tileSize = 256;
        var maxZoom = 8;
        var sw = map.unproject([0, tilesH * tileSize], maxZoom);
        var ne = map.unproject([tilesW * tileSize, 0], maxZoom);
        var bounds = L.latLngBounds(sw, ne);

        var gridSize = tileSize/8;
        var gridW = (tileSize*tilesW)/gridSize;
        var gridH = (tileSize*tilesH)/gridSize;
        var gridSizeCRS = tilesW/gridW;

        let zonesMapData = Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vSM4eS6uvkkqNa3oiwHHxu6aO7HTzRv4OcJSNQyKjl7IL6zcldcO9QoF2KWt__ZtvmMsQ74aTogYREQ/pub?gid=0&single=true&output=csv", {
            download: true,
            header: true,
            complete: function(results) {
                console.log(results);
            }
        })

        console.log(gridSizeCRS) // 0.125

        // gdal raster tile --webviewer leaflet --tiling-scheme raster --tile-size 256 --min-zoom=5 --max-zoom=8 map.png layer_folder

        let base = L.tileLayer('images/base/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 4,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
            attribution: '&copy; <a href="https://nuradan.flygohr.com" target="_top">Nuradan Project</a>'
        });
        
        // let roads = L.tileLayer('images/roads/{z}/{x}/{y}.png', {
        //     maxNativeZoom: 8,
        //     minNativeZoom: 5,
        //     minZoom: 7,
        //     maxZoom: 9,
        //     noWrap: true,
        //     bounds: bounds,
        // });
        
        let pop = L.tileLayer('images/pop/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 6,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
        });
        
        let zones_overlay = L.tileLayer('images/zones/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 6,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
        })
        
        base.addTo(map);
        // roads.addTo(map);
        pop.addTo(map)

        // coords are y, x
        var sund_slope = L.rectangle([[-gridSizeCRS*131, gridSizeCRS*377], [-gridSizeCRS*134, gridSizeCRS*379]], {color: "#ffffff", weight: 1, opacity: 0.6, fillOpacity: 0.2})
        sund_slope.bindPopup('<b><a href="https://worldbuilding.flygohr.com/Sund-Slope" target="_top">Sund Slope</a></b>');

        // TODO: add hover effects

        var zone_boundaries = L.layerGroup([sund_slope])
    
        let coordinatesGridLines = []
        // TODO: for loop with lines that go across the whole map, h and v
        for(i = 0; i < gridW; i++) {
            let line = L.polyline([[0, i*gridSizeCRS], [-gridSizeCRS*gridH, i*gridSizeCRS]], {color: "#ffffff", weight: 1, opacity: 0.6, fillOpacity: 0.2})
            coordinatesGridLines.push(line)
        }

        for(i = 0; i < gridH; i++) {
            let line = L.polyline([[-i*gridSizeCRS, 0], [-i*gridSizeCRS, gridSizeCRS*gridW]], {color: "#ffffff", weight: 1, opacity: 0.6, fillOpacity: 0.2})
            coordinatesGridLines.push(line)
        }

        let coordinatesGridGroup = L.layerGroup(coordinatesGridLines)


        var layerControl = L.control.layers(null, null).addTo(map);
        // layerControl.addOverlay(roads, "Roads and bridges")
        layerControl.addOverlay(pop, "Settlements")
        layerControl.addOverlay(zones_overlay, "Zone boundaries")
        layerControl.addOverlay(zone_boundaries, "Zones")
        layerControl.addOverlay(coordinatesGridGroup, "Coordinates grid")
        
        map.setMaxBounds(bounds);
        // map.fitBounds(bounds);

        //Coordinate Finder
        var marker = L.marker([-16.320367, 48.311807], {
            draggable: true,
        }).addTo(map);
        marker.bindPopup('LatLng finder').openPopup();
        marker.on('dragend', function (e) {
            let cellLat = Math.trunc(marker.getLatLng().lat/gridSizeCRS)
            let cellLng = Math.trunc(marker.getLatLng().lng/gridSizeCRS)
            let preciseCoords = marker.getLatLng().toString()
            let popupString = cellLat + ", " + cellLng + "<br />" + preciseCoords
            // TODO: display both coords AND cell y,x for easier mapping
            marker.getPopup().setContent(popupString).openOn(map);
        });

        //Markers
        // TODO: read from a CSV and produce a marker for each line
        // TODO: export icons for cities, castles, ruins, towns, etc to use with markers 
        var mts_sund = L.marker([-gridSizeCRS*130.5, gridSizeCRS*377.5]).bindPopup('<b><a href="https://worldbuilding.flygohr.com/Sund" target="_top">Sund</a></b>').addTo(map);
    </script>
</body>

</html>
