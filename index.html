<!DOCTYPE html>
<html style="height: 100%;">

<head>
    <title>Nuradan World Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>
</head>

<body style="height: 100%; margin: 0;">
    <div id="map" style="width: 100%; height: 100%; background: #000000;"></div>
    <script type="text/javascript">
        //Creating the Map
        var map = L.map('map', {
            crs: L.CRS.Simple,
            center: [-15.856962, 47.862135],
            zoom: 7,
        });

        var tilesH = 44;
        var tilesW = 78;
        var tileSize = 256;
        var maxZoom = 8;
        var sw = map.unproject([0, tilesH * tileSize], maxZoom);
        var ne = map.unproject([tilesW * tileSize, 0], maxZoom);
        var bounds = L.latLngBounds(sw, ne);

        var gridSize = tileSize/8;
        var gridW = (tileSize*tilesW)/gridSize;
        var gridH = (tileSize*tilesH)/gridSize;
        var gridSizeCRS = tilesW/gridW;
        console.log(gridSizeCRS) // 0.125

        // gdal raster tile --webviewer leaflet --tiling-scheme raster --tile-size 256 --min-zoom=5 --max-zoom=8 map.png layer_folder

        let base = L.tileLayer('images/base/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 4,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
            attribution: '&copy; <a href="https://nuradan.flygohr.com" target="_top">Nuradan Project</a>'
        });
        
        let roads = L.tileLayer('images/roads/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 7,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
        });
        
        let pop = L.tileLayer('images/pop/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 6,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
        });
        
        let zones_overlay = L.tileLayer('images/zones/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 6,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
        })
        
        base.addTo(map);
        roads.addTo(map);
        pop.addTo(map)

        // coords are y, x
        var sund_slope = L.rectangle([[-gridSizeCRS*128, gridSizeCRS*382], [-gridSizeCRS*131, gridSizeCRS*384]], {color: "#ffffff", weight: 1, opacity: 0.6, fillOpacity: 0.2})
        sund_slope.bindPopup('<b><a href="https://worldbuilding.flygohr.com/Sund-Slope" target="_top">Sund Slope</a></b>');

        // TODO: add hover effects

        var zone_boundaries = L.layerGroup([sund_slope])
        
        var layerControl = L.control.layers(null, null).addTo(map);
        layerControl.addOverlay(roads, "Roads and bridges")
        layerControl.addOverlay(pop, "Settlements")
        layerControl.addOverlay(zones_overlay, "Zone boundaries")
        layerControl.addOverlay(zone_boundaries, "Zones")
        
        map.setMaxBounds(bounds);
        // map.fitBounds(bounds);

        //Coordinate Finder
        var marker = L.marker([-16.320367, 48.311807], {
            draggable: true,
        }).addTo(map);
        marker.bindPopup('LatLng finder').openPopup();
        marker.on('dragend', function (e) {
            marker.getPopup().setContent(marker.getLatLng().toString()).openOn(map);
        });

        //Markers
        // TODO: read from a CSV and produce a marker for each line
        // TODO: export icons for cities, castles, ruins, towns, etc to use with markers 
        var mts_sund = L.marker([-15.856962, 47.862135]).bindPopup('<b><a href="https://worldbuilding.flygohr.com/Sund" target="_top">Sund</a></b>').addTo(map);
    </script>
</body>

</html>
