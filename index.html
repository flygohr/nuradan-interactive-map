<!DOCTYPE html>
<html style="height: 100%;">

<head>
    <title>Nuradan World Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>
</head>

<body style="height: 100%; margin: 0;">
    <div id="map" style="width: 100%; height: 100%; background: #000000;"></div>
    <script type="text/javascript">
        //Creating the Map
        var map = L.map('map', {
            crs: L.CRS.Simple,
            center: [-15.856962, 47.862135],
            zoom: 7,
        });

        // at max zoom (z=8): 60*34 @ 256px
        // later it will be 78*44 @ 256px
        var maxZoom = 8;
        var tileSize = 256;
        var sw = map.unproject([0, 44 * tileSize], maxZoom);
        var ne = map.unproject([78 * tileSize, 0], maxZoom);
        var bounds = L.latLngBounds(sw, ne);

        let layer = L.tileLayer('images/full/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 4,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
            attribution: '&copy; <a href="https://nuradan.flygohr.com" target="_top">Nuradan Project</a>'
        });
        // layer.on('tileloadstart', e => console.log(e.coords)); // {x, y, z}
        layer.addTo(map);
        
        let zones_overlay = L.tileLayer('images/zones/{z}/{x}/{y}.png', {
            maxNativeZoom: 8,
            minNativeZoom: 5,
            minZoom: 6,
            maxZoom: 9,
            noWrap: true,
            bounds: bounds,
        })
    
        var layerControl = L.control.addOverlay(zones_overlay, "Zone boundaries").addTo(map);
        
        map.setMaxBounds(bounds);
        // map.fitBounds(bounds);

        //Coordinate Finder
        var marker = L.marker([-16.320367, 48.311807], {
            draggable: true,
        }).addTo(map);
        marker.bindPopup('LatLng finder').openPopup();
        marker.on('dragend', function (e) {
            marker.getPopup().setContent(marker.getLatLng().toString()).openOn(map);
        });

        //Markers
        // TODO: read from a CSV and produce a marker for each line
        // TODO: export icons for cities, castles, ruins, towns, etc to use with markers 
        var mts_sund = L.marker([-15.856962, 47.862135]).bindPopup('<b><a href="https://worldbuilding.flygohr.com/Sund" target="_top">Sund</a></b>').addTo(map);
    </script>
</body>

</html>
